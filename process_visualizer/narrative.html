<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ARBOR 풀이 서사 (narrative)</title>
<style>
:root{--bg:#0f1117;--panel:#171a23;--panel2:#1d2130;--line:#2a2f3e;--txt:#d7dbe6;
  --muted:#8b93a7;--accent:#5aa9ff;--add:#3fb950;--del:#f85149;--chg:#d29922;--goal:#e3b341}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:13px}
.hint{color:var(--muted);font-size:12px}
code{font-family:ui-monospace,Menlo,monospace;background:#222838;padding:1px 4px;border-radius:3px}
.ok{color:var(--add);font-weight:700}.bad{color:var(--del);font-weight:700}
/* select */
#select{padding:24px;max-width:1100px;margin:0 auto}
#select h1{font-size:19px;border-bottom:2px solid var(--line);padding-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:18px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:center}
.card:hover{border-color:var(--muted)}.card .id{font-weight:700;margin-bottom:6px}
table.grid{border-collapse:collapse;display:inline-block;border:1px solid #444;background:#444;margin:2px}
table.grid td{width:10px;height:10px;border:1px solid #222}
/* narrative screen */
#narr{display:none;grid-template-rows:auto 1fr;height:100vh}
#hdr{background:var(--panel);border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:14px;align-items:center}
#hdr b{color:var(--txt)} .lvstack{display:flex;gap:4px;font-size:11px}
.lvchip{padding:1px 7px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.lvchip.on{background:var(--panel2);color:var(--txt);font-weight:700;border-color:var(--txt)}
#body{display:grid;grid-template-columns:1.15fr 1fr;min-height:0}
#flow{overflow:auto;padding:10px 6px;border-right:1px solid var(--line)}
#detail{overflow:auto;padding:12px 14px}
/* narrative lines */
.nl{display:flex;gap:7px;padding:3px 6px;border-radius:6px;cursor:pointer;align-items:baseline;line-height:1.5}
.nl:hover{background:var(--panel)}
.nl.cur{background:#1d2740;outline:1px solid var(--accent)}
.nl .tag{font-size:9.5px;padding:0 6px;border:1px solid;border-radius:7px;font-weight:700;white-space:nowrap;flex:0 0 auto}
.nl .txt{flex:1}
.nl.descend .txt{color:var(--chg)} .nl.unwind .txt{color:var(--add)}
.nl.solved{font-weight:700} .nl.input{color:var(--muted)}
.sub{color:var(--muted);font-size:11.5px;margin-left:4px}
.attempt{font-weight:700;color:var(--accent);margin:8px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
/* detail */
#detail h3{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px;border-bottom:1px solid var(--line);padding-bottom:3px}
#detail h3:first-child{margin-top:0}
.dhead{font-size:14px;font-weight:700;margin-bottom:2px}
table.t{border-collapse:collapse;margin:4px 0;font-size:12px;width:100%}
table.t td,table.t th{border:1px solid var(--line);padding:2px 7px;text-align:left}
.need{background:#241f0a;border-left:2px solid var(--goal);padding:4px 8px;border-radius:4px;margin:4px 0}
.grow{display:flex;align-items:center;gap:6px;margin:4px 0}.gcap{color:var(--muted);font-size:10px;min-width:48px}
.built{outline:2px solid var(--goal);border-radius:4px;padding:2px}
/* WM 접이 트리 */
.wml{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.5}
.wml .added{color:var(--add)}.wml .removed{color:var(--del);text-decoration:line-through;opacity:.7}
.wml .changed{color:var(--chg)}.wml .same{color:var(--txt);opacity:.6}
.wml details{margin:0}.wml summary{cursor:pointer;list-style:none}
.wml summary::-webkit-details-marker{display:none}
.wml summary::before{content:"▸";color:var(--muted);display:inline-block;width:1.1em;text-align:center}
.wml details[open]>summary::before{content:"▾"}
.wml details>:not(summary){margin-left:11px;border-left:1px solid var(--line);padding-left:4px}
.wml .wleaf{padding-left:1.1em}
</style>
</head>
<body>
<div id="select"></div>
<div id="narr">
  <div id="hdr"></div>
  <div id="body">
    <div id="flow"></div>
    <div id="detail"></div>
  </div>
</div>
<script src="data.js"></script>
<script>
const D = window.ARBOR_DATA;
const PAL={0:"#111",1:"#0074D9",2:"#FF4136",3:"#2ECC40",4:"#FFDC00",5:"#AAA",6:"#F012BE",7:"#FF851B",8:"#7FDBFF",9:"#870C25"};
const LAYER={TASK:"#B85450",PAIR:"#D79B00",GRID:"#D6B656",OBJECT:"#82B366",PIXEL:"#6C8EBF"};
const LVIDX={TASK:0,PAIR:1,GRID:2,OBJECT:3,PIXEL:4};
let ti=0, ci=0;            // task index, current narrative entry index
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function gridHTML(raw,cls=""){ if(!raw) return '<span class="hint">(없음)</span>';
  return `<table class="grid ${cls}">`+raw.map(r=>"<tr>"+r.map(v=>`<td style="background:${PAL[v]||'#fff'}"></td>`).join("")+"</tr>").join("")+"</table>"; }

/* ── 서사 생성: step 들 → 의미 있는 사건(원인→결과) 줄 ── */
function buildEntries(t){
  const head={};                                  // big → 그 사이클의 head(view) level
  t.steps.forEach(s=>{ if(s.phase=='view') head[s.big]=s.level; });
  const ind=s=> s.tail ? (LVIDX[s.level]||0) : (LVIDX[head[s.big]] ?? 0);
  // 사건 = input · 각 사이클의 apply · unwind · solved
  return t.steps.map((s,i)=>({s,i})).filter(({s})=>
    ['input','apply','unwind','solved'].includes(s.phase))
    .map(({s,i})=>({s,i,indent:ind(s),level: s.tail?s.level:(head[s.big]||s.level)}));
}
function describe(s){
  const v=s.compared&&s.compared.verdict;
  const commKeys=g=>g?Object.entries(g).filter(([k,x])=>x&&x.verdict=='COMM').map(([k])=>k):[];
  switch(s.op){
    case 'start':            return `<b>input</b> · task 주입 (TASK 노드 → WM)`;
    case 'compare-pairs':    return `비교 <code>P0 ↔ Pa</code> [roles] → <b class="${v=='DIFF'?'bad':'ok'}">${v||'?'}</b>`+(v=='DIFF'?' <span class="sub">↳ 빠진 역할 발견</span>':'');
    case 'localize':         return `국소화 → need <b>${s.need?esc(s.need.attr):'?'}</b> <span class="sub">↳ 무엇이 빠졌나 지목</span>`;
    case 'search-dsl':       return `DSL 검색 <code>${s.need?esc(JSON.stringify(s.need.requires)):''}</code> → ${s.dsl_search&&s.dsl_search.length?'<b class=ok>'+esc(s.dsl_search.join(', '))+'</b>':'<b class=bad>∅</b> <span class="sub">↳ 효과 내는 DSL 없음</span>'}`;
    case 'frame-grid': case 'frame-object':
      return `frame: <code>${s.frame?esc(s.frame.observed):''}</code> = {${s.frame?esc(s.frame.props.join('·')):''}} <span class="sub">↳ 목표 구체화</span>`;
    case 'observe-siblings': return `출력들 비교 [color·contents·size] → COMM: <b>${esc(commKeys(s.grid_props).join('·')||'-')}</b>`;
    case 'observe-change':   return `변화(입력→출력) 일반화 — anti-unify → change-schema`;
    case 'select-object':    return `객체 선택 <span class="sub">↳ ${s.obj_sel?esc(s.obj_sel.reason):''}</span>`;
    case 'compose-grid': case 'compose-object':
      return `조립 <code>make_grid+coloring</code> → grid <span class="ok">✓ 달성</span>`;
    case 'descend':          return `막힘 → <b>${s.level}</b> 로 하강 ↓`;
    case 'unwind':           return `복기(unwind) → ${s.level}`;
    case 'solved':           return `<b>output</b> · 답 기록 → 제출`;
    default:                 return esc(s.op||s.kind);
  }
}
function lineClass(s){ return s.op=='descend'?'descend':s.op=='unwind'?'unwind':s.phase=='solved'?'solved':s.phase=='input'?'input':''; }

/* ── 선택 화면 ── */
function renderSelect(){
  $("select").style.display="block"; $("narr").style.display="none";
  $("select").innerHTML=`<h1>ARBOR 풀이 서사 — <span class="hint">repo: ${esc(D.repo)}</span></h1>
    <p class="hint">문제를 고르면 풀이가 *이야기*로 펼쳐집니다. 줄을 클릭하면 그 순간의 WM·비교·격자 detail.</p>
    <div class="cards">${D.tasks.map((t,i)=>`<div class="card" onclick="openTask(${i})">
      <div class="id">${esc(t.id)} <span class="${t.correct?'ok':'bad'}">${t.correct?'✓':'✗'}</span></div>
      ${gridHTML(t.grids.test[0].in)}</div>`).join("")}</div>`;
}
function openTask(i){ ti=i; ci=0; renderNarr(); }

/* ── 서사 화면 ── */
let ENTRIES=[];
function renderNarr(){
  $("select").style.display="none"; $("narr").style.display="grid";
  const t=D.tasks[ti];
  ENTRIES=buildEntries(t);
  if(ci>=ENTRIES.length) ci=ENTRIES.length-1;
  const cur=ENTRIES[ci].s;
  // 헤더: task + 현재 레벨 스택
  const LV=["TASK","PAIR","GRID","OBJECT"];
  $("hdr").innerHTML=`<b>${esc(t.id)}</b> ${t.correct?'<span class=ok>✓</span>':'<span class=bad>✗</span>'}
    <span class="hint">· attempt 1/3</span> &nbsp; 지금:
    <span class="lvstack">${LV.map(l=>`<span class="lvchip ${l==cur.level?'on':''}" style="${l==cur.level?'border-color:'+LAYER[l]:''}">${l}</span>`).join("")}</span>
    <span style="margin-left:auto" class="hint">↑/↓ 이동 · Esc 복귀</span>`;
  // 서사
  $("flow").innerHTML=`<div class="attempt">▸ attempt 1</div>`+ENTRIES.map((e,k)=>{
    const dk=LAYER[e.level]||"#888";
    return `<div class="nl ${lineClass(e.s)} ${k==ci?'cur':''}" style="margin-left:${e.indent*20}px"
      onclick="ci=${k};renderNarr()">
      <span class="tag" style="border-color:${dk};color:${dk}">${esc(e.level||'·')}</span>
      <span class="txt">${describe(e.s)}</span></div>`;
  }).join("");
  // detail
  $("detail").innerHTML=detailHTML(cur);
  const curEl=$("flow").querySelector(".nl.cur"); if(curEl) curEl.scrollIntoView({block:"nearest"});
}

function detailHTML(s){
  let h=`<div class="dhead">${describe(s)}</div>
    <div class="hint">${esc(s.op||s.kind)} · ${esc(s.level||'')} · step ${s.big}</div>`;
  // 목표/need
  const g=(s.goals||[]).find(x=>x.active)||(s.goals||[])[(s.goals||[]).length-1];
  if(g){ h+=`<h3>목표 / need</h3><div>${esc(g.intent||'')} <span class="hint">[${esc(g.status||'')}]</span></div>`;
    if(g.need) h+=`<div class="need">↳ need ${esc(g.need)}</div>`; }
  // 비교 receipt
  if(s.comparisons&&s.comparisons.length){
    h+=`<h3>비교 (무엇↔무엇 → 결과)</h3><table class="t"><tr><th>#</th><th>left</th><th>right</th><th>attr</th><th>결과</th></tr>`+
      s.comparisons.map(c=>`<tr><td>${c.i}</td><td><code>${esc(c.left)}</code></td><td><code>${esc(c.right)}</code></td><td>${esc(c.attr)}</td><td class="${c.result=='COMM'?'ok':'bad'}">${esc(c.result)}</td></tr>`).join("")+`</table>`;
  }
  // 탐색/속성 스코프
  if(s.grid_props){ h+=`<h3>속성별 비교</h3><table class="t"><tr><th>property</th><th>verdict</th></tr>`+
    Object.entries(s.grid_props).map(([k,v])=>`<tr><td>${k}</td><td class="${v.verdict=='COMM'?'ok':'bad'}">${esc(v.verdict)}</td></tr>`).join("")+`</table>`; }
  if(s.dsl_search) h+=`<h3>DSL 검색 결과</h3><div>${s.dsl_search.length?'<b class=ok>['+esc(s.dsl_search.join(', '))+']</b>':'<b class=bad>∅</b>'}</div>`;
  // 격자
  const t=D.tasks[ti];
  h+=`<h3>격자</h3>`+t.grids.train.map((p,i)=>`<div class="grow"><span class="gcap">train${i}</span>${gridHTML(p.in)}→${gridHTML(p.out)}</div>`).join("")+
    t.grids.test.map(p=>`<div class="grow"><span class="gcap">test</span>${gridHTML(p.in)}→<span class="hint">?</span></div>`).join("")+
    (s.built?`<div class="grow"><span class="gcap">조립물</span><span class="built">${gridHTML(s.built)}</span></div>`:"");
  // WM 접이 트리
  h+=`<h3>WM (이 순간 · 변화 강조)</h3><div class="wml">${wmTree(s.wm||[])}</div>`;
  return h;
}
function wmTree(es){
  let i=0;
  function line(e){ const pre={added:"+",removed:"-",changed:"~",same:" "}[e.status]||" ";
    return {cls:e.status, txt:`${pre} (${esc(e.id)} ^${esc(e.attr)} ${esc(e.val)})`}; }
  function render(depth){ let html="";
    while(i<es.length && es[i].depth===depth){ const e=es[i]; i++;
      const kids=(i<es.length)&&es[i].depth===depth+1; const{cls,txt}=line(e);
      if(kids){ const op=(e.attr=='color')?'':' open';
        html+=`<details${op}><summary class="${cls}">${txt}</summary>${render(depth+1)}</details>`; }
      else html+=`<div class="wleaf ${cls}">${txt}</div>`; }
    return html; }
  return render(0)||'<span class="hint">(변화 없음/없음)</span>';
}

document.addEventListener("keydown",e=>{
  if($("narr").style.display=="none") return;
  if(e.key=="Escape"){ renderSelect(); }
  else if(e.key=="ArrowDown"){ ci=Math.min(ENTRIES.length-1,ci+1); renderNarr(); e.preventDefault(); }
  else if(e.key=="ArrowUp"){ ci=Math.max(0,ci-1); renderNarr(); e.preventDefault(); }
});
renderSelect();
</script>
</body>
</html>
